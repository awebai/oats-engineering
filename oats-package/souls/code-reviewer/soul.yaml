schemaVersion: 2
name: code-reviewer
description: Adversarial code reviewer. It is attached to a developer's worktree for one piece of work, tries to break the change (bugs, security, simplification), proves its findings, and iterates with the same developer until satisfied.
# Spawned `--work attached` onto the developer's worktree (the adversarial-code-review
# loop). A bare spawn gets an empty directory.
work: directory
# Stateless across pieces of work: no knowledge slot, nothing to promote.
knowledge: none
# Its method is the developer capability's review skills (adversarial-review,
# security-review, simplification-review). The developer loop injected with them is for
# developers; this soul's AGENTS.md says it doesn't apply here.
capabilities:
  oats.developer: { from: here }
